<!-- Melodee web editor. One file, no libraries. Protocol: EDITOR_PROTOCOL.md.
     Add ?mock=1 to the URL to use a built-in simulated device. -->
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Melodee Editor</title>
<style>
  /* Fukiai: Hügelton Instruments' icon font (MIT, FUKIAI-LICENSE.txt). Icons are text in .ic spans;
     they stay hidden until the face has loaded (html.fk), so a missing font never shows boxes. */
  @font-face { font-family: "Fukiai"; src: url("fukiai.ttf") format("truetype"); font-display: block; unicode-range: U+EA00-EB09; }
  :root { --bg: #fff; --fg: #000; --dim: #777; --line: #ccc; }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) { --bg: #000; --fg: #fff; --dim: #888; --line: #444; }
  }
  :root[data-theme="dark"] { --bg: #000; --fg: #fff; --dim: #888; --line: #444; }
  html { color-scheme: light dark; }
  body { margin: 0; background: var(--bg); color: var(--fg);
         font: 13px/1.4 -apple-system, BlinkMacSystemFont, "Helvetica Neue", Arial, sans-serif;
         font-variant-numeric: tabular-nums; }
  main { max-width: 1100px; margin: 0 auto; padding: 16px; }
  h1 { font-size: 18px; font-weight: 600; margin: 0 0 8px; }
  h2 { font-size: 13px; font-weight: 600; margin: 0 0 4px; padding-bottom: 2px; border-bottom: 1px solid var(--fg); }
  h3 { font-size: 11px; font-weight: 400; color: var(--dim); margin: 4px 0 0; }
  a { color: inherit; }
  .lang { float: right; font-size: 12px; color: var(--dim); text-decoration: underline; background: none; padding: 0; }
  button { font: inherit; background: var(--fg); color: var(--bg); border: 0; padding: 2px 10px; cursor: pointer; }
  button:disabled { opacity: .3; cursor: default; }
  button.lang { color: var(--dim); background: none; }
  select, input[type=text], input[type=number], input[type=search] {
    font: inherit; color: var(--fg); background: var(--bg); border: 1px solid var(--line); padding: 1px 3px; border-radius: 0; }
  input[type=range] { width: 100%; margin: 0; accent-color: var(--fg); }
  input[type=checkbox] { accent-color: var(--fg); margin: 0; }
  .bar { display: flex; flex-wrap: wrap; gap: 6px 12px; align-items: center; margin: 0 0 8px; }
  .dim { color: var(--dim); }
  #status { min-height: 1.4em; }
  section { margin: 12px 0; }
  .groups { columns: 250px; column-gap: 20px; }
  .group { break-inside: avoid; margin: 0 0 12px; }
  .row { display: grid; grid-template-columns: 46px 1fr 70px; gap: 6px; align-items: center; min-height: 22px; }
  .row .v { text-align: right; white-space: nowrap; }
  .row select { width: 100%; }
  .browser { display: flex; flex-wrap: wrap; gap: 12px; align-items: flex-start; }
  .browser select[size] { min-width: 150px; }
  .slots { display: grid; grid-template-columns: auto auto auto auto; gap: 3px 8px; align-items: center; justify-content: start; }
  table { border-collapse: collapse; }
  th { font-weight: 400; color: var(--dim); text-align: left; padding: 0 6px 2px 0; }
  td { padding: 1px 6px 1px 0; }
  td.i { color: var(--dim); text-align: right; }
  #steps input[type=text] { width: 120px; }
  #steps input[type=number] { width: 48px; }
  #steps .bad { outline: 1px solid var(--fg); text-decoration: underline wavy; }
  #steps tr.off td { color: var(--dim); }
  .stepcols { columns: 470px; column-gap: 24px; }
  .stepcols table { break-inside: avoid; }
  @media (max-width: 600px) {
    .stepcols { columns: auto; overflow-x: auto; }
    #steps input[type=text] { width: 84px; }
    #steps input[type=number] { width: 42px; }
    #steps th, #steps td { padding-right: 3px; }
  }
  .smp { margin: 0 0 14px; padding: 6px 0 0; border-top: 1px solid var(--line); }
  .smp.over { outline: 1px solid var(--fg); outline-offset: 2px; }
  .smp .head { display: flex; flex-wrap: wrap; gap: 4px 12px; align-items: center; }
  .smp .head b { font-weight: 600; min-width: 40px; }
  .smp progress { width: 160px; height: 6px; accent-color: var(--fg); }
  .smp table { margin: 4px 0; }
  .smp input.name { width: 80px; text-transform: uppercase; }
  .smp input.root { width: 48px; }
  .smp .bad { text-decoration: underline wavy; }
  footer { margin-top: 24px; font-size: 11px; color: var(--dim); }
  .row.pushed .v { font-weight: 600; }
  /* librarian: local library and the device's user bank side by side, stacked on a phone */
  .libcols { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 340px), 1fr)); gap: 8px 24px; margin-top: 6px; }
  .libcols > div { min-width: 0; }
  .libcols .bar input[type=search] { flex: 1 1 120px; min-width: 0; }
  .list { height: 260px; overflow: auto; border: 1px solid var(--line); resize: vertical; }
  .list table { width: 100%; table-layout: fixed; }
  .list th { position: sticky; top: 0; background: var(--bg); padding: 1px 6px; }
  .list td { padding: 1px 6px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .list tr[data-id], .list tr[data-slot], .list tr[data-fm6] { cursor: pointer; }
  .list tr.sel td { background: var(--fg); color: var(--bg); }
  .list tr.empty td { color: var(--dim); }
  .list tr.over td { outline: 1px dashed var(--fg); outline-offset: -1px; }
  .list.over { outline: 1px solid var(--fg); }
  .list .none { padding: 6px; color: var(--dim); }
  .list col.n { width: 40px; } .list col.e { width: 72px; } .list col.d { width: 78px; }
  .ic { font-family: "Fukiai"; font-style: normal; font-weight: 400; font-synthesis: none; line-height: 1; margin-right: .3em; }
  html:not(.fk) .ic { display: none; }
  /* wave choices: a page-drawn picker so the options can carry an icon (Chrome 135+); native menus get words only */
  @supports (appearance: base-select) {
    select.wave, select.wave::picker(select) { appearance: base-select; }
    select.wave { padding: 1px 3px; min-block-size: 0; border: 1px solid var(--line); border-radius: 0; background: var(--bg); color: var(--fg); }
    select.wave > button { font: inherit; background: none; color: inherit; padding: 0; text-align: start; }
    select.wave::picker(select) { border: 1px solid var(--line); background: var(--bg); color: var(--fg); padding: 0; }
    select.wave option { padding: 1px 6px; min-block-size: 0; }
    select.wave option:checked { font-weight: 600; }
    select.wave option:hover, select.wave option:focus-visible { background: var(--fg); color: var(--bg); }
    select.wave option::checkmark { display: none; }
  }
  /* tabs: a wrapping row of plain buttons, the open one inverted; header stays at the top on wide screens */
  .top { position: sticky; top: 0; z-index: 5; background: var(--bg); padding: 4px 0 0; }
  @media (max-width: 600px) { .top { position: static; } }
  .tabs { display: flex; flex-wrap: wrap; gap: 0; border-bottom: 1px solid var(--fg); margin: 6px 0 0; }
  .tabs button { background: none; color: var(--dim); padding: 4px 10px; border: 1px solid transparent; border-bottom: 0; white-space: nowrap; }
  .tabs button:hover { color: var(--fg); }
  .tabs button[aria-selected="true"] { background: var(--fg); color: var(--bg); }
  .trackbar { display: flex; flex-wrap: wrap; gap: 4px 8px; align-items: center; padding: 6px 0; border-bottom: 1px solid var(--line); }
  .seg { display: inline-flex; flex-wrap: wrap; }
  .seg button, button.tog { background: var(--bg); color: var(--fg); border: 1px solid var(--fg); padding: 1px 10px; }
  .seg button + button { border-left: 0; }
  .seg button[aria-pressed="true"], button.tog[aria-pressed="true"] { background: var(--fg); color: var(--bg); }
  .panel { margin: 12px 0; }
  .hint { margin: 16px 0; color: var(--dim); }
  /* sequencer: a step grid over the selected track (16 per row, 8 on a phone) */
  .grid { display: grid; grid-template-columns: repeat(16, minmax(0, 1fr)); gap: 2px; margin: 6px 0 12px; }
  @media (max-width: 600px) { .grid { grid-template-columns: repeat(8, minmax(0, 1fr)); } }
  .grid button { background: var(--bg); color: var(--fg); border: 1px solid var(--line); padding: 2px; min-width: 0; height: 52px;
                 display: flex; flex-direction: column; justify-content: flex-start; gap: 1px; text-align: left; overflow: hidden; font-size: 10px; line-height: 1.15; }
  .grid button .n { color: var(--dim); }
  .grid button .x { overflow: hidden; overflow-wrap: anywhere; flex: 1; }
  .grid button.on { background: var(--fg); color: var(--bg); border-color: var(--fg); }
  .grid button.on .n { color: inherit; opacity: .6; }
  .grid button.acc .x { font-weight: 700; }
  .grid button.tie { border-style: dashed; border-color: var(--fg); }
  .grid button.beat { border-left-color: var(--fg); }
  #steps tr.hl td { outline: 1px solid var(--fg); }
  /* mixer: four channel strips as on the device's TRACKS page */
  .mixer { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; max-width: 640px; margin: 6px 0; }
  .strip { border: 1px solid var(--line); padding: 6px 4px; display: flex; flex-direction: column; align-items: center; gap: 6px; min-width: 0; }
  .strip.sel { border-color: var(--fg); box-shadow: inset 0 0 0 1px var(--fg); }
  .strip .num { font-size: 18px; font-weight: 600; line-height: 1; }
  .strip .snd { font-size: 11px; line-height: 1.3; width: 100%; text-align: center; overflow-wrap: anywhere; min-height: 2.6em; }
  .strip .rec { font-size: 11px; color: var(--dim); }
  .strip .rec.on { color: var(--fg); font-weight: 600; }
  .strip .rec:not(.on) .ic { visibility: hidden; }
  .strip input.fader { writing-mode: vertical-lr; direction: rtl; width: 28px; height: 150px; }
  .strip .v { font-size: 11px; white-space: nowrap; }
  .strip .pan { width: 100%; }
  .strip.muted .fader, .strip.muted .lv { opacity: .35; }
  .strip button { width: 100%; padding: 1px 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .strip button.selb:disabled { opacity: 1; background: none; color: var(--dim); }
  #sysinfo th { padding-right: 16px; }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<main>
  <button class="lang" id="lang"></button>
  <h1>Melodee Editor</h1>
  <p class="dim"><a href="../installer/" style="color:inherit" data-t="installer"></a></p>
  <!-- always visible: connection, version, sync mode, the tabs and (Sound / Sequencer / Tracks) the track selector -->
  <header class="top">
    <div class="bar">
      <button id="connect" data-t="connect" data-ic="port_usb_c"></button>
      <span id="version" class="dim"></span>
      <span id="live" class="dim"></span>
      <span id="mock" class="dim" hidden data-t="mock"></span>
    </div>
    <div id="status"></div>
    <nav class="tabs" id="tabs" role="tablist">
      <button role="tab" data-tab="sound" data-t="sound" data-ic="symbol_audio"></button>
      <button role="tab" data-tab="sequencer" data-t="tabSeq" data-ic="symbol_grid"></button>
      <button role="tab" data-tab="tracks" data-t="tabTracks" data-ic="ui_slider_vertical"></button>
      <button role="tab" data-tab="library" data-t="library" data-ic="symbol_books"></button>
      <button role="tab" data-tab="samples" data-t="samples" data-ic="symbol_waves"></button>
      <button role="tab" data-tab="projects" data-t="projects" data-ic="symbol_folder"></button>
      <button role="tab" data-tab="settings" data-t="tabSettings" data-ic="symbol_cog"></button>
    </nav>
    <div class="trackbar" id="trackbar" hidden><span class="dim" data-t="track"></span><span class="seg" id="trackbtns" role="group"></span></div>
  </header>
  <p class="hint" id="hint" hidden></p>

  <section class="panel" id="p-sound" data-tab="sound" data-dev hidden>
    <div class="browser" id="browser">
      <label><span data-t="engine"></span><br><select id="engine"></select></label>
      <label><span data-t="presets"></span><br><select id="preset" size="8"></select></label>
      <div>
        <p class="bar"><button id="init" data-t="initSound"></button>
          <button id="factlib" data-t="factoryToLib" data-ic="symbol_folder"></button></p>
        <p class="bar"><button id="savefile" data-t="saveFile" data-ic="symbol_download"></button>
          <button id="loadfile" data-t="loadFile" data-ic="symbol_upload"></button>
          <input type="file" id="file" accept=".json,application/json" hidden></p>
      </div>
    </div>
    <p class="dim" id="drumnote" data-t="drumNote" hidden></p>
    <p class="dim" id="ctlhelp" data-t="ctlHelp"></p>
    <div class="groups" id="groups"></div>
  </section>

  <section class="panel" id="p-sequencer" data-tab="sequencer" data-dev hidden>
    <div class="groups" id="seqgroups"></div>
    <div id="steps">
      <h2 data-t="steps" data-ic="note_eight"></h2>
      <p class="bar"><button id="reloadsteps" data-t="reload" data-ic="control_arrow_loop"></button>
        <button id="clearseq" data-t="clearSeq" data-ic="symbol_trash"></button>
        <span class="dim" id="noteshelp"></span></p>
      <div class="grid" id="stepgrid"></div>
      <div class="stepcols" id="steptables"></div>
    </div>
  </section>

  <section class="panel" id="p-tracks" data-tab="tracks" data-dev hidden>
    <h2 data-t="mixer" data-ic="ui_slider_vertical"></h2>
    <div class="mixer" id="mixer"></div>
    <p class="dim" data-t="mixHelp"></p>
  </section>

  <!-- works without a device too (the device bank shows while connected) -->
  <section class="panel" id="p-library" data-tab="library" hidden>
    <div class="libcols" id="libsec">
      <div id="libpane">
        <h2 data-t="library" data-ic="symbol_books"></h2>
        <div class="bar">
          <input type="search" id="libq" spellcheck="false">
          <select id="libeng"></select>
          <select id="libtag"></select>
          <select id="libsort"></select>
        </div>
        <div class="list" id="liblist"></div>
        <p class="bar" style="margin-top:6px">
          <button id="libaud" data-t="audition" data-ic="symbol_audio"></button>
          <button id="libput" data-t="toSlot" data-ic="symbol_upload"></button>
          <button id="libren" data-t="rename"></button>
          <button id="libtags" data-t="tags"></button>
          <button id="libdup" data-t="duplicate"></button>
          <button id="libdel" data-t="delete" data-ic="symbol_trash"></button>
          <button id="libexp1" data-t="exportPatch" data-ic="symbol_download"></button>
        </p>
        <p class="bar">
          <button id="libsave" data-t="saveToLib" data-ic="port_disk"></button>
          <button id="libimport" data-t="import" data-ic="symbol_upload"></button>
          <button id="libexport" data-t="exportLib" data-ic="symbol_download"></button>
          <input type="file" id="libfile" accept=".json,.syx,application/json" multiple hidden>
          <span class="dim" id="libcount"></span>
        </p>
        <p class="dim" data-t="dx7Help"></p>
      </div>
      <div>
        <h2 data-t="bank" data-ic="port_disk"></h2>
        <p class="dim" id="bankhint"></p>
        <div id="bankpane" hidden>
          <div class="bar"><b id="bankhead"></b></div>
          <div class="list" id="banklist"></div>
          <p class="bar" style="margin-top:6px">
            <button id="bkload" data-t="bankLoad" data-ic="symbol_folder_open"></button>
            <button id="bkstore" data-t="bankStore" data-ic="port_disk"></button>
            <button id="bkget" data-t="bankGet" data-ic="symbol_download"></button>
            <button id="bkerase" data-t="erase" data-ic="symbol_trash"></button>
          </p>
          <p class="bar">
            <button id="bkrefresh" data-t="reload" data-ic="control_arrow_loop"></button>
            <button id="bkexport" data-t="exportBank" data-ic="symbol_download"></button>
            <span class="dim" data-t="dndHelp"></span>
          </p>
        </div>
      </div>
      <div>
        <h2 data-t="fm6Bank" data-ic="ui_knob"></h2>
        <p class="dim" id="fm6hint"></p>
        <div id="fm6pane" hidden>
          <div class="bar"><b id="fm6head"></b></div>
          <div class="list" id="fm6list"></div>
          <p class="bar" style="margin-top:6px">
            <button id="fmuse" data-t="fm6Use" data-ic="symbol_audio"></button>
            <button id="fmget" data-t="bankGet" data-ic="symbol_download"></button>
            <button id="fmclear" data-t="erase" data-ic="symbol_trash"></button>
          </p>
          <p class="bar">
            <button id="fmimport" data-t="fm6Import" data-ic="symbol_upload"></button>
            <button id="fmexport" data-t="fm6Export" data-ic="symbol_download"></button>
            <button id="fmrefresh" data-t="reload" data-ic="control_arrow_loop"></button>
            <input type="file" id="fmfile" accept=".syx" hidden>
          </p>
          <p class="dim" data-t="fm6Help"></p>
        </div>
      </div>
    </div>
  </section>

  <section class="panel" id="p-samples" data-tab="samples" data-dev hidden>
    <h2 data-t="samples" data-ic="symbol_waves"></h2>
    <p class="dim" data-t="smpHelp"></p>
    <div id="smpslots"></div>
  </section>

  <section class="panel" id="p-projects" data-tab="projects" data-dev hidden>
    <h2 data-t="projects" data-ic="symbol_folder"></h2>
    <p class="dim" data-t="projHelp"></p>
    <div class="slots" id="slots"></div>
  </section>

  <section class="panel" id="p-settings" data-tab="settings" data-dev hidden>
    <div class="groups" id="setgroups"></div>
    <div class="group" style="margin-top:12px">
      <h2 data-t="system" data-ic="symbol_cog"></h2>
      <table id="sysinfo"></table>
    </div>
  </section>

  <footer><a href="https://github.com/keremimo/melodee" target="_blank" rel="noopener">Melodee</a> by Ellic Studio,
    based on <a href="https://github.com/hugelton/Felucca" target="_blank" rel="noopener">Felucca</a> by Leo Kuroshita (@kurogedelic),
    <a href="https://hugelton.com" target="_blank" rel="noopener">Hügelton Instruments</a>. GPL-3.0.<br>
    <span data-t="foot"></span> M-VAVE and FM-1 are trademarks of their respective owners.<br>
    <a href="FUKIAI-LICENSE.txt" data-t="iconsCredit"></a></footer>

<script>
"use strict";
/*PROTO-BEGIN*/
/* ---------------------------------------------------------------- protocol --- */
const HDR = [0x7D, 0x46, 0x4C];
const CMD = { INFO: 1, GET: 2, SET: 3, DUMP: 4, DESC: 5, STEP_GET: 6, STEP_SET: 7, PRESET: 8, PROJECT: 9, NAMES: 10,
  SMP_BEGIN: 11, SMP_WRITE: 12, SMP_END: 13, SMP_ERASE: 14, SMP_INFO: 15,
  UP_LIST: 16, UP_GET: 17, UP_PUT: 18, UP_STORE: 19, UP_LOAD: 20, UP_ERASE: 21,
  WATCH: 22, CHANGED: 23, RELOAD: 24, PING: 25, STEP_CHANGED: 26,
  TRACK: 27, TRACK_MIX: 28, TRACK_DUMP: 29, TRACK_STEP: 30,
  TRACK_PARAM: 31, TRACK_CHANGED: 32 };
/* frames the device sends on its own (while WATCH is on); never replies */
const PUSH = new Set([CMD.CHANGED, CMD.RELOAD, CMD.STEP_CHANGED, CMD.TRACK_CHANGED]);
/* user preset bank: name 1..12 printable ASCII, a 16-step pattern of (note, flags 1 acc 2 slide 4 tie) */
const UP = { NAME_MAX: 12, PAT: 16, LIST_MAX: 16 };
const F = { INT: 0, PCT: 1, BIPCT: 2, TIME: 3, LFOHZ: 4, CUTOFF: 5, DB: 6, SEMI: 7, ENUM: 8, BPM: 9, NOTE: 10, ONOFF: 11, OCT: 12, STEPS: 13 };

const v14enc = (v) => { const u = Math.max(-8192, Math.min(8191, Math.round(v))) + 8192; return [u & 0x7F, (u >> 7) & 0x7F]; };
const v14dec = (lo, hi) => (lo | (hi << 7)) - 8192;
function strEnc(s) { const a = []; for (const c of String(s)) a.push(c.charCodeAt(0) & 0x7F); a.push(0); return a; }

/* only ever builds F0 7D 46 4C ... F7 */
function frame(cmd, args = []) {
  for (const b of args) if (!(Number.isInteger(b) && b >= 0 && b <= 0x7F)) throw new Error("bad data byte " + b);
  return [0xF0, ...HDR, cmd & 0x7F, ...args, 0xF7];
}
/* -> {cmd, a} or null when it is not an editor frame */
function unframe(d) {
  if (!d || d.length < 6 || d[0] !== 0xF0 || d[d.length - 1] !== 0xF7) return null;
  if (d[1] !== HDR[0] || d[2] !== HDR[1] || d[3] !== HDR[2]) return null;
  return { cmd: d[4], a: Array.from(d.slice(5, d.length - 1)) };
}

class Reader {
  constructor(a) { this.a = a; this.i = 0; }
  b() { if (this.i >= this.a.length) throw new Error("short reply"); return this.a[this.i++]; }
  v() { const lo = this.b(); return v14dec(lo, this.b()); }
  s() { let s = ""; for (;;) { const c = this.b(); if (!c) return s; s += String.fromCharCode(c); } }
}

const parse = {
  [CMD.INFO](a) {
    const r = new Reader(a);
    const o = { version: r.s(), nengines: r.b(), pcount: r.b(), gcount: r.b(), nstep: r.b(), pe0: r.b(), engines: [] };
    for (let i = 0; i < o.nengines; i++) o.engines.push(r.s());
    o.ntrk = r.i < a.length ? r.b() : 0;             /* v3: tracks (0 = older firmware, one instrument) */
    return o;
  },
  [CMD.GET](a) { const r = new Reader(a); return { scope: r.b(), id: r.b(), value: r.v() }; },
  [CMD.SET](a) { return parse[CMD.GET](a); },
  /* needs the counts from INFO */
  [CMD.DUMP](a, info) {
    const r = new Reader(a);
    const o = { engine: r.b(), preset: r.b(), p: [], g: [] };
    for (let i = 0; i < info.pcount; i++) o.p.push(r.v());
    for (let i = 0; i < info.gcount; i++) o.g.push(r.v());
    return o;
  },
  [CMD.DESC](a) {
    const r = new Reader(a);
    const o = { scope: r.b(), id: r.b(), fmt: r.b(), min: r.v(), max: r.v(), def: r.v(), label: r.s(), unit: r.s(), names: [] };
    if (o.fmt === F.ENUM) for (let i = 0; i <= o.max - o.min && i < 16; i++) o.names.push(r.s());
    return o;
  },
  [CMD.STEP_GET](a) {
    const r = new Reader(a);
    const o = { index: r.b(), n: r.b(), notes: [r.b(), r.b(), r.b(), r.b()], time: r.b(), flags: r.b(), vel: r.b() };
    return o;
  },
  [CMD.STEP_SET](a) { return parse[CMD.STEP_GET](a); },
  [CMD.PRESET](a) { const r = new Reader(a); return { engine: r.b(), preset: r.b() }; },
  [CMD.PROJECT](a) { const r = new Reader(a); return { op: r.b(), slot: r.b(), used: r.b() }; },
  [CMD.NAMES](a) {
    const r = new Reader(a);
    const o = { engine: r.b(), names: [] };
    const n = r.b();
    for (let i = 0; i < n; i++) o.names.push(r.s());
    o.titles = [];
    try { o.titles.push(r.s(), r.s()); } catch (e) { o.titles = []; }   /* older firmware: no page titles */
    return o;
  },
  [CMD.SMP_BEGIN](a) { const r = new Reader(a); return { slot: r.b(), rc: r.b() }; },
  [CMD.SMP_WRITE](a) { const r = new Reader(a); return { slot: r.b(), offset: r.b() | (r.b() << 7) | (r.b() << 14), rc: r.b() }; },
  [CMD.SMP_END](a) { return parse[CMD.SMP_BEGIN](a); },
  [CMD.SMP_ERASE](a) { return parse[CMD.SMP_BEGIN](a); },
  [CMD.SMP_INFO](a) {
    const r = new Reader(a);
    const o = { nslots: r.b(), slotKiB: r.b(), slots: [] };
    for (let i = 0; i < o.nslots; i++) o.slots.push({ zones: r.b(), name: r.s(), kib: r.b() });
    return o;
  },
  [CMD.UP_LIST](a) {
    const r = new Reader(a);
    const o = { start: r.b(), count: r.b(), total: r.b(), slots: [] };
    for (let i = 0; i < o.count; i++) o.slots.push({ slot: o.start + i, used: r.b(), engine: r.b(), name: r.s() });
    return o;
  },
  /* needs P_COUNT from INFO */
  [CMD.UP_GET](a, info) {
    const r = new Reader(a);
    const o = { slot: r.b(), used: r.b(), engine: r.b(), name: r.s(), p: [], pattern: [] };
    for (let i = 0; i < info.pcount; i++) o.p.push(r.v());
    for (let i = 0; i < UP.PAT; i++) o.pattern.push([r.b(), r.b()]);
    return o;
  },
  [CMD.UP_PUT](a) { return parse[CMD.SMP_BEGIN](a); },
  [CMD.UP_STORE](a) { return parse[CMD.SMP_BEGIN](a); },
  [CMD.UP_LOAD](a) { return parse[CMD.SMP_BEGIN](a); },
  [CMD.UP_ERASE](a) { return parse[CMD.SMP_BEGIN](a); },
  [CMD.WATCH](a) { return { on: new Reader(a).b() }; },
  [CMD.CHANGED](a) { return parse[CMD.GET](a); },
  [CMD.RELOAD](a) { const r = new Reader(a); return { engine: r.b(), preset: r.b(), track: r.i < a.length ? r.b() : 0 }; },
  [CMD.PING](a) { return {}; },
  [CMD.STEP_CHANGED](a) { const r = new Reader(a); return { index: r.b(), track: r.i < a.length ? r.b() : 0 }; },
  /* v3: tracks. engine === NENGINES: the drum track */
  [CMD.TRACK](a) {
    const r = new Reader(a);
    const o = { sel: r.b(), ntrk: r.b(), tracks: [] };
    for (let i = 0; i < o.ntrk; i++) o.tracks.push({ engine: r.b(), preset: r.b(), level: r.v(), mute: r.b(), armed: r.b() });
    return o;
  },
  [CMD.TRACK_MIX](a) { const r = new Reader(a); return { track: r.b(), level: r.v(), mute: r.b() }; },
  [CMD.TRACK_DUMP](a, info) {
    const r = new Reader(a);
    const o = { track: r.b(), engine: r.b(), preset: r.b(), p: [] };
    for (let i = 0; i < info.pcount; i++) o.p.push(r.v());
    return o;
  },
  [CMD.TRACK_STEP](a) {
    const r = new Reader(a);
    return { track: r.b(), index: r.b(), n: r.b(), notes: [r.b(), r.b(), r.b(), r.b()], time: r.b(), flags: r.b(), vel: r.b() };
  },
  /* v4: a parameter of any track (the selection stays), and its push for a track that is not selected */
  [CMD.TRACK_PARAM](a) { const r = new Reader(a); return { track: r.b(), id: r.b(), value: r.v() }; },
  [CMD.TRACK_CHANGED](a) { return parse[CMD.TRACK_PARAM](a); },
};

/* a name the device accepts: printable ASCII, 1..12 characters */
function upName(s) { return String(s ?? "").replace(/[^\x20-\x7E]/g, "").trim().slice(0, UP.NAME_MAX) || "PATCH"; }

const req = {
  info: () => [CMD.INFO, []],
  get: (scope, id) => [CMD.GET, [scope, id]],
  set: (scope, id, v) => [CMD.SET, [scope, id, ...v14enc(v)]],
  dump: () => [CMD.DUMP, []],
  desc: (scope, id) => [CMD.DESC, [scope, id]],
  stepGet: (i) => [CMD.STEP_GET, [i]],
  stepSet: (i, st) => {
    const n = Math.max(0, Math.min(4, st.n | 0));
    const notes = [0, 1, 2, 3].map((k) => (st.notes[k] | 0) & 0x7F);
    return [CMD.STEP_SET, [i, n, ...notes, Math.max(0, Math.min(2, st.time | 0)), st.flags & 3, (st.vel | 0) & 0x7F]];
  },
  preset: (e, p) => [CMD.PRESET, [e & 0x7F, p & 0x7F]],
  project: (op, slot) => { if (![0, 1, 2].includes(op)) throw new Error("bad PROJECT op"); return [CMD.PROJECT, [op, slot & 3]]; },   /* 0 load, 1 save, 2 query */
  names: (e) => [CMD.NAMES, [e & 0x7F]],
  smpBegin: (s) => [CMD.SMP_BEGIN, [s & 0x7F]],
  smpWrite: (s, off, bytes) => [CMD.SMP_WRITE, [s & 0x7F, off & 0x7F, (off >> 7) & 0x7F, (off >> 14) & 0x7F, ...pack7(bytes)]],
  smpEnd: (s, hdr) => [CMD.SMP_END, [s & 0x7F, ...pack7(hdr)]],
  smpErase: (s) => [CMD.SMP_ERASE, [s & 0x7F]],
  smpInfo: () => [CMD.SMP_INFO, []],
  upList: (start, count) => [CMD.UP_LIST, [start & 0x7F, Math.max(1, Math.min(UP.LIST_MAX, count | 0))]],
  upGet: (s) => [CMD.UP_GET, [s & 0x7F]],
  /* patch: {engine, name, p: P_COUNT values, pattern: 16 x [note, flags]} */
  upPut: (s, pt) => [CMD.UP_PUT, [s & 0x7F, pt.engine & 0x7F, ...strEnc(upName(pt.name)), ...pt.p.flatMap((v) => v14enc(v ?? 0)),
    ...Array.from({ length: UP.PAT }, (_, i) => { const x = (pt.pattern || [])[i] || [0, 0]; return [x[0] & 0x7F, x[1] & 7]; }).flat()]],
  upStore: (s, name) => [CMD.UP_STORE, [s & 0x7F, ...strEnc(name ? upName(name) : "")]],   /* "": the device names it ("ANALOG 07") */
  upLoad: (s) => [CMD.UP_LOAD, [s & 0x7F]],
  upErase: (s) => [CMD.UP_ERASE, [s & 0x7F]],
  /* on: 1 = pushes; 3 = also TRACK_CHANGED (v4 firmware answers 3, older firmware 1) */
  watch: (on) => [CMD.WATCH, [on === 3 ? 3 : on ? 1 : 0]],
  ping: () => [CMD.PING, []],
  /* v3: tracks 0..3 (3 = drums) */
  track: (sel) => [CMD.TRACK, sel == null ? [] : [sel & 0x7F]],
  trackMix: (tr, level, mute) => [CMD.TRACK_MIX, level == null ? [tr & 0x7F] : [tr & 0x7F, ...v14enc(level), mute ? 1 : 0]],
  trackDump: (tr) => [CMD.TRACK_DUMP, [tr & 0x7F]],
  trackStep: (tr, i, st) => [CMD.TRACK_STEP, st ? [tr & 0x7F, ...req.stepSet(i, st)[1]] : [tr & 0x7F, i & 0x7F]],
  /* v4: get (v == null) or set parameter id (P_*) of track tr, clamped as SET */
  trackParam: (tr, id, v) => [CMD.TRACK_PARAM, v == null ? [tr & 0x7F, id & 0x7F] : [tr & 0x7F, id & 0x7F, ...v14enc(v)]],
};

/* which reply belongs to which request (the device echoes these) */
function replyMatches(cmd, args, a) {
  switch (cmd) {
    case CMD.GET: case CMD.SET: case CMD.DESC: return a[0] === args[0] && a[1] === args[1];
    case CMD.STEP_GET: case CMD.STEP_SET: case CMD.NAMES:
    case CMD.SMP_BEGIN: case CMD.SMP_END: case CMD.SMP_ERASE: return a[0] === args[0];
    case CMD.SMP_WRITE: return a[0] === args[0] && a[1] === args[1] && a[2] === args[2] && a[3] === args[3];
    case CMD.PROJECT: return a[0] === args[0] && a[1] === args[1];
    case CMD.UP_LIST: case CMD.UP_GET: case CMD.UP_PUT: case CMD.UP_STORE: case CMD.UP_LOAD: case CMD.UP_ERASE:
    case CMD.TRACK_MIX: case CMD.TRACK_DUMP: return a[0] === args[0];
    case CMD.WATCH: return (a[0] & 1) === (args[0] & 1);   /* bit 1: v4 firmware only */
    case CMD.TRACK_STEP: case CMD.TRACK_PARAM: return a[0] === args[0] && a[1] === args[1];
    default: return true;
  }
}

/* strict request/response: one frame in flight, the rest queued. Push frames (CHANGED, RELOAD,
   STEP_CHANGED) can come at any time, also between a request and its reply: they go to onPush. */
class Link {
  constructor(send, opts = {}) {
    this.sendRaw = send;
    this.q = [];
    this.cur = null;
    this.closed = false;
    this.lastSent = 0;                              /* Date.now() of the last frame sent (WATCH keep-alive) */
    this.timeout = opts.timeout || 300;
    this.onUnknown = opts.onUnknown || (() => {});
    this.onTimeout = opts.onTimeout || (() => {});
    this.onPush = opts.onPush || (() => {});
    this.onGap = opts.onGap || (() => {});         /* (ms) nothing was sent for that long (WATCH may have ended) */
  }
  get idle() { return !this.cur && !this.q.length; }
  hasQueued(key) { return this.q.some((r) => r.key === key); }
  /* Yamaha SysEx through the queue (fm6_store.c): send (null: nothing), then after `settle` ms the dump
     request; done when check(reply) returns a value. Editor traffic waits meanwhile: older firmware can
     lose a pending Yamaha frame when another SysEx arrives too soon, and a bank's flash write takes a
     while (a retry sends both again, with twice the settle time). */
  yamaha(send, request, check, fail, opt = {}) {
    if (this.closed) return Promise.reject(new Error("closed"));
    return new Promise((res, rej) => {
      this.q.push({ cmd: null, yam: { send, request, check, fail }, res, rej, timeout: opt.timeout ?? 700,
        retries: opt.retries ?? 2, settle: opt.settle ?? 120 });
      this.pump();
    });
  }
  /* a single voice into the FM6 part's buffer, confirmed by its echo */
  transferDX7(message, opt = {}) {
    let voice;
    try {
      if (message.length !== 163) throw new Error("Expected a DX7 single voice");
      voice = dx7ForDevice(readDX7File(message).patches[0].dx7);
    } catch (e) { return Promise.reject(e); }
    return this.yamaha(dx7Message(voice), [0xF0, 0x43, 0x20, 0, 0xF7], (d) => {
      if (d.length !== 163) return undefined;
      const v = readDX7File(d).patches[0].dx7;
      return v.every((x, i) => x === voice[i]) ? v : undefined;
    }, "DX7 voice was not confirmed by the device. Try Audition again.", opt);
  }
  /* the FM6 user bank: -> its 4096 bytes */
  readFM6Bank(opt = {}) {
    return this.yamaha(null, [0xF0, 0x43, 0x20, 9, 0xF7], fm6Bank.read, "The FM6 voice bank could not be read.",
      { timeout: 1500, retries: 1, ...opt });
  }
  /* the whole FM6 user bank (the device saves it to flash), confirmed by reading it back */
  writeFM6Bank(bank, opt = {}) {
    return this.yamaha(fm6Bank.message(bank), [0xF0, 0x43, 0x20, 9, 0xF7], (d) => {
      const b = fm6Bank.read(d);
      return b && b.every((v, i) => v === bank[i]) ? b : undefined;
    }, "The FM6 voice bank was not confirmed by the device.", { timeout: 1500, settle: 400, ...opt });
  }
  /* r = [cmd, args]; opt: {timeout, retries, key (coalesce queued requests: the latest args win), front,
     quiet (a timeout is expected: no onTimeout)} */
  request(r, opt = {}) {
    if (this.closed) return Promise.reject(new Error("closed"));
    const [cmd, args] = r;
    if (opt.key) {
      const old = this.q.find((x) => x.key === opt.key);
      if (old) { old.cmd = cmd; old.args = args; return old.promise; }
    }
    let res, rej;
    const promise = new Promise((a, b) => { res = a; rej = b; });
    const item = { cmd, args, key: opt.key, res, rej, promise, quiet: !!opt.quiet,
      timeout: opt.timeout || this.timeout, retries: opt.retries ?? 1 };
    if (opt.front) this.q.unshift(item); else this.q.push(item);
    this.pump();
    return promise;
  }
  pump() {
    if (this.cur || this.closed || !this.q.length) return;
    this.cur = this.q.shift();
    this.fire();
  }
  fire() {
    const c = this.cur;
    const now = Date.now();
    if (this.lastSent && now - this.lastSent > 2500) this.onGap(now - this.lastSent);
    this.lastSent = now;
    const y = c.yam, settle = y && y.send ? c.settle : 0;
    try {
      this.sendRaw(y ? y.send || y.request : frame(c.cmd, c.args));
      if (settle) c.readTimer = setTimeout(() => {
        if (this.cur !== c) return;
        this.lastSent = Date.now();
        try { this.sendRaw(y.request); } catch (e) { this.finish(null, e); }
      }, settle);
    } catch (e) { this.finish(null, e); return; }
    c.timer = setTimeout(() => {
      if (this.cur !== c) return;
      if (c.retries-- > 0) { if (settle) c.settle *= 2; this.fire(); return; }
      if (!c.quiet && !y) this.onTimeout(c.cmd);
      this.finish(null, new Error(y ? y.fail : "timeout (cmd " + c.cmd + ")"));
    }, c.timeout + settle);
  }
  finish(val, err) {
    const c = this.cur;
    if (!c) return;
    clearTimeout(c.timer);
    clearTimeout(c.readTimer);
    this.cur = null;
    if (err) c.rej(err); else c.res(val);
    this.pump();
  }
  /* raw incoming MIDI bytes */
  receive(data) {
    const pending = this.cur;
    if (pending && pending.yam && data[0] === 0xF0 && data[1] === 0x43) {
      let v;
      try { v = pending.yam.check(data); } catch (e) { /* corrupt or unrelated Yamaha frame: wait for a valid readback */ }
      if (v !== undefined) this.finish(v);
      return;
    }
    const f = unframe(data);
    if (!f) return;                                  /* not ours (notes, clock, other SysEx) */
    if (PUSH.has(f.cmd)) { this.onPush(f); return; }
    const c = this.cur;
    if (!c || f.cmd !== c.cmd || !replyMatches(c.cmd, c.args, f.a)) { this.onUnknown(f); return; }
    this.finish(f.a);
  }
  close() {
    this.closed = true;
    const all = (this.cur ? [this.cur] : []).concat(this.q);
    if (this.cur) clearTimeout(this.cur.timer);
    if (this.cur) clearTimeout(this.cur.readTimer);
    this.cur = null;
    this.q = [];
    for (const r of all) r.rej(new Error("closed"));
  }
}

/* ------------------------------------------------------------- formatting --- */
const NOTE_NAMES = ["C", "C#", "D", "D#", "E", "F", "F#", "G", "G#", "A", "A#", "B"];
const noteName = (n) => NOTE_NAMES[n % 12] + (Math.floor(n / 12) - 1);   /* 60 = C4 */
/* GM drum notes (35..81) by short names, for the drum track's steps */
const GM_DRUM = { 35: "KICK2", 36: "KICK", 37: "RIM", 38: "SNARE", 39: "CLAP", 40: "SNARE2", 41: "LTOM2", 42: "CHH", 43: "LTOM",
  44: "PHH", 45: "MTOM2", 46: "OHH", 47: "MTOM", 48: "HTOM2", 49: "CRASH", 50: "HTOM", 51: "RIDE", 52: "CHINA", 53: "BELL",
  54: "TAMB", 55: "SPLASH", 56: "COWBELL", 57: "CRASH2", 58: "VIBRA", 59: "RIDE2", 60: "HBONGO", 61: "LBONGO", 62: "MCONGA",
  63: "HCONGA", 64: "LCONGA", 65: "HTIMB", 66: "LTIMB", 67: "HAGOGO", 68: "LAGOGO", 69: "CABASA", 70: "MARACA", 71: "SWHIS",
  72: "LWHIS", 73: "SGUIRO", 74: "LGUIRO", 75: "CLAVES", 76: "HWOOD", 77: "LWOOD", 78: "MCUICA", 79: "OCUICA", 80: "MTRI", 81: "OTRI" };
const GM_DRUM_BY_NAME = Object.fromEntries(Object.entries(GM_DRUM).map(([n, s]) => [s, +n]));
const drumName = (n) => GM_DRUM[n] || String(n);
/* a note token: a number, a note name (C4, F#3, Bb2) or a GM drum name (KICK, CHH) */
function parseNote(tok) {
  const dn = GM_DRUM_BY_NAME[tok.toUpperCase()];
  if (dn != null) return dn;
  if (/^\d+$/.test(tok)) { const n = +tok; return n <= 127 ? n : null; }
  const m = /^([A-Ga-g])([#b]?)(-?\d)$/.exec(tok);
  if (!m) return null;
  const base = { C: 0, D: 2, E: 4, F: 5, G: 7, A: 9, B: 11 }[m[1].toUpperCase()];
  const n = base + (m[2] === "#" ? 1 : m[2] === "b" ? -1 : 0) + (parseInt(m[3], 10) + 1) * 12;
  return n >= 0 && n <= 127 ? n : null;
}
/* "C4 E4 G4" -> [60, 64, 67]; null on a bad token or more than 4 notes */
function parseNotes(s) {
  const t = s.trim().split(/[\s,]+/).filter(Boolean);
  if (t.length > 4) return null;
  const out = t.map(parseNote);
  return out.includes(null) ? null : out;
}

/* close to the device's param_format (params.c), tables from tools/gen_tables.py */
function fmtValue(d, v) {
  const sign = (x) => (x > 0 ? "+" + x : String(x));
  switch (d.fmt) {
    case F.PCT: return [String(Math.trunc((v * 100 + 63) / 127)), "%"];
    case F.BIPCT: return [sign(Math.trunc(v * 100 / 64)), "%"];
    case F.TIME: {
      const ms10 = Math.round(10 * Math.pow(10000, (v & 127) / 127));
      if (ms10 < 100) return [(ms10 / 10).toFixed(1), "ms"];
      if (ms10 < 10000) return [String(Math.round(ms10 / 10)), "ms"];
      return [(ms10 / 10000).toFixed(2), "s"];
    }
    case F.LFOHZ: { const h = 0.05 * Math.pow(800, (v & 127) / 127); return [h < 10 ? h.toFixed(2) : h.toFixed(1), "Hz"]; }
    case F.CUTOFF: { const h = 30 * Math.pow(16000 / 30, (v & 127) / 127); return h < 1000 ? [String(Math.round(h)), "Hz"] : [(h / 1000).toFixed(1), "kHz"]; }
    case F.DB: return v <= 0 ? ["OFF", ""] : [((v - 112) / 2).toFixed(1), "dB"];
    case F.SEMI: return [sign(v), "st"];
    case F.ENUM: return [d.names[v - d.min] ?? String(v), d.unit || ""];
    case F.BPM: return [String(v), "BPM"];
    case F.NOTE: return [NOTE_NAMES[((v % 12) + 12) % 12], ""];
    case F.ONOFF: return [v ? "ON" : "OFF", ""];
    case F.STEPS: return [String(v), "STEP"];
    default: return [String(v), d.unit || ""];
  }
}

/* ---------------------------------------------------------- user samples --- */
/* A port of tools/sampleio.py (read_any_wav, resample, to_int16, ima_encode, user_slot),
   byte for byte: web/test_web.mjs compares them. */
const SMP = { SLOTS: 1, SLOT_SIZE: 0x14000, DATA_OFF: 512, RATE: 22050, HDR_LEN: 32 + 16 * 28, MAX_ZONES: 16 };
SMP.MAX_DATA = SMP.SLOT_SIZE - SMP.DATA_OFF;

/* groups of up to 7 bytes, each preceded by their top bits */
function pack7(b) {
  const out = [];
  for (let i = 0; i < b.length; i += 7) {
    const g = Array.from(b.slice(i, i + 7));
    out.push(g.reduce((m, x, j) => m | (((x >> 7) & 1) << j), 0));
    for (const x of g) out.push(x & 0x7F);
  }
  return out;
}
function unpack7(a) {
  const out = [];
  for (let i = 0; i < a.length; i += 8) {
    const top = a[i];
    for (let j = 0; j < 7 && i + 1 + j < a.length; j++) out.push(a[i + 1 + j] | (((top >> j) & 1) << 7));
  }
  return Uint8Array.from(out);
}

const CRC_TABLE = (() => {
  const t = new Uint32Array(256);
  for (let n = 0; n < 256; n++) { let c = n; for (let k = 0; k < 8; k++) c = c & 1 ? 0xEDB88320 ^ (c >>> 1) : c >>> 1; t[n] = c >>> 0; }
  return t;
})();
function crc32(b) { let c = 0xFFFFFFFF; for (let i = 0; i < b.length; i++) c = CRC_TABLE[(c ^ b[i]) & 0xFF] ^ (c >>> 8); return (c ^ 0xFFFFFFFF) >>> 0; }

const IMA_STEP = [7, 8, 9, 10, 11, 12, 13, 14, 16, 17, 19, 21, 23, 25, 28, 31, 34, 37, 41, 45, 50, 55, 60, 66, 73, 80, 88,
  97, 107, 118, 130, 143, 157, 173, 190, 209, 230, 253, 279, 307, 337, 371, 408, 449, 494, 544, 598, 658,
  724, 796, 876, 963, 1060, 1166, 1282, 1411, 1552, 1707, 1878, 2066, 2272, 2499, 2749, 3024, 3327, 3660,
  4026, 4428, 4871, 5358, 5894, 6484, 7132, 7845, 8630, 9493, 10442, 11487, 12635, 13899, 15289, 16818,
  18500, 20350, 22385, 24623, 27086, 29794, 32767];
const IMA_IDX = [-1, -1, -1, -1, 2, 4, 6, 8];
/* IMA ADPCM, 4 bit, low nibble first, from predictor 0 / index 0 -> {data, pred, idx} (state at loopStart) */
function imaEncode(s, loopStart = 0) {
  let pred = 0, idx = 0, atLoop = [0, 0];
  const nib = new Uint8Array(s.length + (s.length & 1));
  for (let n = 0; n < s.length; n++) {
    if (n === loopStart) atLoop = [pred, idx];
    const step = IMA_STEP[idx];
    let diff = s[n] - pred, code = 0;
    if (diff < 0) { code = 8; diff = -diff; }
    let vd = step >> 3;
    if (diff >= step) { code |= 4; diff -= step; vd += step; }
    if (diff >= step >> 1) { code |= 2; diff -= step >> 1; vd += step >> 1; }
    if (diff >= step >> 2) { code |= 1; vd += step >> 2; }
    pred = Math.max(-32768, Math.min(32767, code & 8 ? pred - vd : pred + vd));
    idx = Math.max(0, Math.min(88, idx + IMA_IDX[code & 7]));
    nib[n] = code;
  }
  const out = new Uint8Array(nib.length >> 1);

  if (!zones.length || zones.length > SMP.MAX_ZONES) throw new Error("1..16 files per slot");

/* A patch (library entry, user preset):

      dx7?: [155 seven-bit VCED bytes] (FM6 imported voice; also retained in JSON exports)}

  if (!steps || steps.length < info.nstep) {
    steps = [];
    for (let i = 0; i < info.nstep; i++) steps.push(parse[CMD.STEP_GET](await rq(req.stepGet(i))));
  }
  const empty = steps.every((s) => !s || !s.n);
  await rq(req.set(1, opt.gEng ?? 20, engine));
  const dump = parse[CMD.DUMP](await rq(req.dump()), info);
  const n = Math.min(info.pcount, pt.p.length);
  for (let i = 0; i < n; i++) {
    const v = pt.p[i];
    if (opt.progress) opt.progress(i, n);
    if (v == null || v === dump.p[i]) continue;
    await rq(req.set(0, i, v));
  }
  /* an empty sequencer gets the patch's pattern, or stays empty (no pattern of that first preset) */
  const wrote = empty && patternUsed(pt.pattern);
  if (empty) {
    const ps = stepsFromPattern(pt.pattern);
    for (let i = 0; i < UP.PAT && i < info.nstep; i++) await rq(req.stepSet(i, ps[i]));
    if (wrote && opt.slen != null) await rq(req.set(0, opt.slen, Math.max(1, Math.min(16, pt.p[opt.slen] ?? 16))));   /* as UP_LOAD */
  }
  if (voice) await opt.sendDX7(voice);
  return { wrote };
}

/* WATCH on (asking for TRACK_CHANGED too): false when the firmware does not know it (older than protocol v2),
   else 1, or 3 when it also has TRACK_PARAM / TRACK_CHANGED (protocol v4) */
async function startWatch(rq) {
  try { const on = parse[CMD.WATCH](await rq(req.watch(3), { timeout: 300, retries: 1, quiet: true })).on; return on & 1 ? on & 3 : false; }
  catch (e) { if (e.message === "closed") throw e; return false; }
}

/* ------------------------------------------------------------ mixer (v3) --- */
/* The TRACKS page in the editor: TRACK (engine, preset, level, mute, armed of all four) and TRACK_DUMP
   of each track for its P_PAN. Level and mute go through TRACK_MIX (any track; the drum level is
   G_DRLVL). Pan: TRACK_PARAM (v4, any track); with v3 firmware a plain SET, which reaches only the
   selected track: another track is selected for it and the selection is put back (TRACK pushes no
   RELOAD). ids: {pan: P_PAN id} */
const mixer = {
  async read(rq, info, ids) {
    const tr = parse[CMD.TRACK](await rq(req.track()));
    for (let i = 0; i < tr.ntrk; i++) {
      const d = parse[CMD.TRACK_DUMP](await rq(req.trackDump(i)), info);
      tr.tracks[i].pan = ids.pan == null ? null : d.p[ids.pan];
    }
    return tr;
  },
  /* -> {track, level, mute} as the device has them now */
  async setMix(rq, track, level, mute, opt) { return parse[CMD.TRACK_MIX](await rq(req.trackMix(track, level, mute), opt)); },
  /* -> the pan value after clamping. v4: TRACK_PARAM, the selection stays */
  async setPan(rq, track, sel, panId, v, v4) {
    if (v4) return parse[CMD.TRACK_PARAM](await rq(req.trackParam(track, panId, v), { key: "pan:" + track })).value;
    if (track === sel) return parse[CMD.SET](await rq(req.set(0, panId, v))).value;
    await rq(req.track(track));
    try { return parse[CMD.SET](await rq(req.set(0, panId, v))).value; }
    finally { await rq(req.track(sel)).catch(() => {}); }
  },
};

  if (name === "tracks" && prev !== "tracks" && hasTracks() && dev.dump) op(readMixer);
}
function renderPanels() {
  /* the Tracks tab only with a four-track firmware */
  const tracksOk = !dev || hasTracks() || !dev.info;
  const want = tab === "tracks" && dev && dev.info && !hasTracks() ? "sound" : tab;
  for (const b of $("tabs").querySelectorAll("button[data-tab]")) {
    const on = b.dataset.tab === want;
    b.setAttribute("aria-selected", on ? "true" : "false");
    b.tabIndex = on ? 0 : -1;
    if (b.dataset.tab === "tracks") b.hidden = !tracksOk;
  }
  const ready = !!dev && !!dev.dump;
  let hint = "";
  for (const p of document.querySelectorAll(".panel")) {
    const mine = p.dataset.tab === want;
    let show = mine && (!("dev" in p.dataset) || ready);
    if (mine && "dev" in p.dataset && !dev) hint = "needDevice";   /* (while connecting the status line says it) */
    if (show && want === "samples" && !dev.smp) { show = false; hint = "smpNone"; }
    p.hidden = !show;
  }
  $("hint").hidden = !hint;
  if (hint) $("hint").textContent = t(hint);

}
$("tabs").addEventListener("click", (e) => { const b = e.target.closest("button[data-tab]"); if (b) showTab(b.dataset.tab); });
$("tabs").addEventListener("keydown", (e) => {          /* arrow keys move between the tabs */
  const dir = { ArrowRight: 1, ArrowLeft: -1 }[e.key];

window.addEventListener("hashchange", () => { const h = location.hash.slice(1); if (TABS.includes(h) && h !== tab) showTab(h); });

const QS = new URLSearchParams(location.search);
const MOCK = QS.get("mock") === "1";
$("mock").hidden = !MOCK;
let mock = null;

/* -------------------------------------------------------------- state --- */
let access = null;     /* MIDIAccess */
let dev = null;        /* {link, input, output, info, pdesc[], gdesc[], names[][], dump, steps[], slotUsed[],
                          keys[] (paramKeys), watch (pushes on), bank ({total, slots[]} or null: no user bank)} */
let busy = 0;          /* multi-request operations in progress: no polling */
let dragging = null;   /* key of the slider being dragged */
let wantConnected = false;
const ctl = new Map(); /* key "s:id" -> {input, out, desc, scope, id, row} */
const sets = new Map(); /* key -> {last: time of the user's last change, sent: the value last requested} */
let needReload = false; /* a RELOAD push came: re-read DESC, DUMP and steps when free */
let lastDump = 0;      /* Date.now() of the last DUMP */
/* the device also pushes RELOAD after loads the editor asked for (SET of G_ENGSEL, PRESET, PROJECT load,
   UP_LOAD); the editor re-reads after those anyway, so it skips that many RELOADs for a moment */
const selfReload = { n: 0, until: 0 };
function selfLoad() {
  if (!dev || !dev.watch) return;
  const now = Date.now();
  selfReload.n = now < selfReload.until ? selfReload.n + 1 : 1;
  selfReload.until = now + 1500;
}
const stepEdit = new Map(); /* index -> time of the last edit */

/* parameter ids (firmware/src/core.h); used only when P_COUNT / G_COUNT match */
const EXPECT = { pcount: 58, gcount: 27, pe0: 50 };
const P = { LEVEL: 0, SLEN: 29 };
const LAYOUT = (pe0) => [
  { t: "ENV", pages: [["ENV", 0, [1, 2, 3, 4]], ["ENV DEST", 0, [5, 6, 7]]] },   /* (P_ED_FX 8: nothing reads it) */
  { t: "LFO", pages: [["LFO", 0, [9, 10, 11, 12]], ["LFO DEST", 0, [13, 14, 15, 16]]] },
  { t: "EDIT", engine: true, pages: [["EDIT 1", 0, [pe0, pe0 + 1, pe0 + 2, pe0 + 3]], ["EDIT 2", 0, [pe0 + 4, pe0 + 5, pe0 + 6, pe0 + 7]]] },
  { t: "VOICE", pages: [["LEVEL", 0, [0]], ["VOICE", 0, [37, 38, 41, 42]], ["VOICE 2", 0, [43, 44, 39, 40]]] },
  { t: "FX", pages: [["FX", 0, [33, 34, 35, 36]], ["SLICER", 0, [45, 46, 47, 48]], ["DLY", 1, [4, 5, 6, 7]], ["REV/CHO", 1, [8, 9, 10, 11]]] },
  { t: "SCL", pages: [["SCL", 0, [25, 26, 27, 28]], ["MPC", 0, [49]]] },   /* MPC: the pad degree (QNT MPC) */
  { t: "ARP", pages: [["ARP", 0, [17, 18, 19, 20]], ["ARP 2", 0, [21, 22, 23, 24]]] },
  { t: "SEQ PATTERN", tab: "seqgroups", pages: [["PATTERN", 0, [29, 30, 31, 32]]] },
  { t: "GLOBAL", tab: "setgroups", pages: [["GLOBAL", 1, [0, 1, 2, 3]]] },
  { t: "DRUMS", tab: "setgroups", pages: [["DRUMS", 1, [24, 25, 26]]] },
];
/* globals that are actions or placeholders on the device: buttons instead, or hidden */
const G_SKIP = new Set(["SLOT", "NAME", "LOAD", "SAVE", "ENG", "SET", "KEYS", "CLRSQ", "INIT", "MIDI", "OUT", "IN", "CPU", "CLK"]);
const key = (s, id) => s + ":" + id;
const gEng = () => { const i = dev.gdesc.findIndex((d) => d && d.label === "ENG"); return i >= 0 ? i : 20; };
const pSlen = () => { const i = dev.pdesc.findIndex((d) => d && d.fmt === F.STEPS); return i >= 0 ? i : P.SLEN; };
/* mixer ids by DESC label (core.h: P_PAN 39, P_MUTE 40, G_DRLVL 25) */
const pById = (label, def) => { const i = dev.pdesc.findIndex((d, k) => d && k < dev.info.pe0 && d.label === label); return i >= 0 ? i : def; };
const pPan = () => pById("PAN", 39), pMute = () => pById("MUTE", 40);
const gDrLvl = () => { const i = dev.gdesc.findIndex((d, k) => d && k > gEng() && (d.label === "LVL" || d.label === "LEVEL")); return i >= 0 ? i : 25; };
const isDrum = () => !!dev && !!dev.dump && dev.dump.engine >= dev.info.nengines;

/* -------------------------------------------------------------- MIDI --- */
async function connect() {
  wantConnected = true;
  if (!MOCK && !navigator.requestMIDIAccess) { sayK("nomidi"); return; }
  $("connect").disabled = true;
  sayK("connecting");
  try {
    if (!access) {
      if (MOCK) { mock = makeMockDevice({ legacy: QS.get("legacy") === "1", fm6: QS.get("fm6") !== "0" }); access = mock.access; }
      else {
        try { access = await navigator.requestMIDIAccess({ sysex: true }); }
        catch (e) { sayK("denied"); return; }
      }
      access.onstatechange = onState;
    }
    const isF = (p) => /melodee|felucca/i.test(p.name || "") && p.state !== "disconnected";
    const input = [...access.inputs.values()].find(isF);
    const output = [...access.outputs.values()].find(isF);
    if (!input || !output) { sayK("nodevice"); return; }
    const link = new Link((d) => output.send(d), {
      timeout: 300,
      onUnknown: (f) => console.debug("ignored reply", f),
      onTimeout: () => sayK("noreply"),
      onPush: (f) => onPush(f),
      onGap: () => { rewatch = true; },
    });
    input.onmidimessage = (e) => link.receive(e.data);
    if (input.open) await input.open().catch(() => {});
    dev = { link, input, output, info: null, pdesc: [], gdesc: [], names: [], dump: null, steps: [], slotUsed: [null, null, null, null],
      keys: null, watch: false, bank: null, fm6: null };
    setLabel($("connect"), t("disconnect"));
    await load(dev);
  } catch (e) {
    console.error(e);
    if (dev) {                                       /* not unplugged meanwhile (that says "lost") */
      const timeout = /^timeout/.test(e.message);
      disconnect();
      sayK(timeout ? "noreply" : "error", timeout ? "" : e.message);
    }
  } finally {
    $("connect").disabled = false;
  }
}

function disconnect(reasonKey = "disconnected") {
  if (dev) {
    dev.link.close();
    dev.input.onmidimessage = null;
  }
  dev = null;
  busy = 0;
  needReload = false;
  renderPanels();
  renderMixer();
  renderSysinfo();
  renderLive();
  renderLib();
  renderBank();
  renderFm6();
  $("version").textContent = "";
  setLabel($("connect"), t("connect"));
  sayK(reasonKey);
}

function onState(e) {
  const p = e.port;
  if (!p || !/melodee|felucca/i.test(p.name || "")) return;
  if (dev && p.state === "disconnected" && (p.id === dev.input.id || p.id === dev.output.id)) {
    disconnect("lost");
  } else if (!dev && wantConnected && p.state === "connected" && p.type === "output") {
    clearTimeout(onState.tm);                       /* the device came back: reconnect */
    onState.tm = setTimeout(() => { if (!dev && wantConnected) connect(); }, 800);
  }
}

const rq = (r, opt) => dev.link.request(r, opt);
async function getDesc(scope, id) { return parse[CMD.DESC](await rq(req.desc(scope, id))); }
async function getDump() { lastDump = Date.now(); return parse[CMD.DUMP](await rq(req.dump()), dev.info); }
async function getStep(i) { return parse[CMD.STEP_GET](await rq(req.stepGet(i))); }

/* the whole connect sequence */
async function load(d) {
  busy++;
  try {
    /* the first frame after opening the port can be lost: a few tries */
    d.info = parse[CMD.INFO](await d.link.request(req.info(), { timeout: 500, retries: 3 }));
    $("version").textContent = d.info.version;
    const total = d.info.pcount + d.info.gcount;
    for (let i = 0; i < d.info.pcount; i++) { sayK("reading", `${i + 1}/${total}`); d.pdesc[i] = await getDescOrNull(0, i); }
    for (let i = 0; i < d.info.gcount; i++) { sayK("reading", `${d.info.pcount + i + 1}/${total}`); d.gdesc[i] = await getDescOrNull(1, i); }
    d.titles = [];
    for (let e = 0; e < d.info.nengines; e++) {
      const r = parse[CMD.NAMES](await d.link.request(req.names(e)));
      d.names[e] = r.names;
      d.titles[e] = r.titles;
    }
    for (let k = 0; k < 4; k++) {                    /* PROJECT op 2: is the slot used */
      try { d.slotUsed[k] = parse[CMD.PROJECT](await d.link.request(req.project(2, k))).used; }
      catch (e) { if (e.message === "closed") throw e; }
    }
    try { d.smp = parse[CMD.SMP_INFO](await d.link.request(req.smpInfo())); }
    catch (e) { if (e.message === "closed") throw e; d.smp = null; }   /* older firmware, or no flash */
    d.keys = paramKeys(d.pdesc, d.info.pe0, d.info.pcount);
    await libAdopt(d);
    if (d.info.ntrk) d.sel = parse[CMD.TRACK](await d.link.request(req.track())).sel;   /* v3: the selected track */
    d.dump = await getDump();
    buildUI();
    renderPanels();
    await loadSteps();
    if (d.info.ntrk) await readMixer();
    /* protocol v2: live pushes and the user bank; older firmware: DUMP polling, no bank */
    const rqd = (r, o) => d.link.request(r, o);
    d.watch = await startWatch(rqd);
    d.v4 = d.watch === 3;                           /* TRACK_PARAM / TRACK_CHANGED */
    if (d.watch) {
      sayK("readingBank");
      try { d.bank = await bank.list((r, o) => d.link.request(r, { ...o, quiet: true })); }
      catch (e) { if (e.message === "closed") throw e; d.bank = null; }
    }
    if (d.info.engines.includes("FM6")) {           /* the FM6 user bank: a 32-voice DX7 dump */
      sayK("fm6Reading");
      try { d.fm6 = fm6State(await d.link.readFM6Bank()); }
      catch (e) { if (e.message === "closed") throw e; d.fm6 = null; }
    }
    renderLive();
    renderLib();
    renderBank();
    renderFm6();
    renderSysinfo();
    sayK("ready");
  } finally { busy--; }
}
async function getDescOrNull(s, i) { try { return await getDesc(s, i); } catch (e) { if (e.message === "closed") throw e; return null; } }

/* rebuilds the controls only when the engine or its parameters changed (a slider being dragged survives) */
async function rereadEngineDesc() {
  const pe0 = dev.info.pe0;
  const before = JSON.stringify(dev.pdesc.slice(pe0));
  for (let i = 0; i < 8 && pe0 + i < dev.info.pcount; i++) dev.pdesc[pe0 + i] = await getDescOrNull(0, pe0 + i);
  if (dev.built !== dev.dump.engine || JSON.stringify(dev.pdesc.slice(pe0)) !== before) buildGroups();
}

async function loadSteps() {
  const n = dev.info.nstep;
  for (let i = 0; i < n; i++) {
    if (i % 8 === 0) sayK("steploading", `${i}/${n}`);
    dev.steps[i] = await getStep(i);
  }
  renderSteps();
}

/* --------------------------------------------------------------- UI --- */
function buildUI() {
  const sel = $("engine");
  sel.replaceChildren(...dev.info.engines.map((n, i) => el("option", { value: i, text: n })));
  dev.mix = null;
  buildGroups();
  updateBrowser();
  renderSlots();
  renderSamples();
  renderSysinfo();
}

/* the track selector (v3): T1..T3 synth parts, T4 the drum track; the editor shows the selected one */
function renderTrackbar() {
  const box = $("trackbtns");
  const ntrk = hasTracks() ? dev.info.ntrk : 0;
  if (box.children.length !== ntrk || box.dataset.lang !== lang) {

}
function selectTrack(i) {

/* settings > system: what the device reported */
function renderSysinfo() {
  const box = $("sysinfo");

  const rows = [
    ["firmware", i.version], ["sync", t(dev.watch ? "live" : "polling")], ["enginesL", i.engines.join(", ")],
    ["tracksN", i.ntrk ? String(i.ntrk) : "1"], ["stepsN", String(i.nstep)],
    ["smpSlots", dev.smp ? `${dev.smp.nslots} × ${dev.smp.slotKiB} KiB` : t("none")],
    ["userBank", dev.bank ? String(dev.bank.total) : t("none")],

}

function updateBrowser() {
  const e = dev.dump.engine;
  const sel = $("engine");
  const drum = e >= dev.info.nengines;              /* the drum track: no engine, no presets */
  renderTrackbar();
  sel.disabled = drum;
  $("preset").disabled = drum;
  $("init").disabled = drum;
  $("factlib").disabled = drum;
  $("drumnote").hidden = !drum;

  $("ctlhelp").hidden = drum;

  }

function visible(d) { return d && d.max > d.min && d.label !== "-"; }

function buildGroups() {
  ctl.clear();
  dev.built = dev.dump.engine;
  /* Sound: the selected track's parameters; Sequencer: its pattern settings; Settings: globals and drums */
  const groups = { groups: [], seqgroups: [], setgroups: [] };
  const { info } = dev;
  const drum = isDrum();                            /* the drum track: its kit's controls (P_E0..P_E7) only */
  if (info.pcount === EXPECT.pcount && info.gcount === EXPECT.gcount && info.pe0 === EXPECT.pe0) {
    for (const g of LAYOUT(info.pe0)) {
      if (drum && !g.engine && !g.tab) continue;
      const div = el("div", { class: "group" }, el("h2", { ic: HEAD_IC[g.t], text: g.engine ? (drum ? "KIT" : `EDIT ${info.engines[dev.dump.engine] || ""}`) : g.t }));
      for (const [title, s, ids] of g.pages) {
        const rows = ids.map((id) => paramRow(s, id)).filter(Boolean);
        if (!rows.length) continue;
        const tt = g.engine && (drum ? ["BD SD", "TUNE DCY"] : dev.titles[dev.dump.engine] || [])[g.pages.findIndex((x) => x[0] === title)];   /* (the drum track: ui_draw.c's titles) */
        if (g.pages.length > 1) div.append(el("h3", { ic: PAGE_IC[tt || title], text: tt || title }));
        div.append(...rows);
      }
      groups[g.tab || "groups"].push(div);
    }
  } else {
    /* unknown firmware layout: everything in id order */
    const a = el("div", { class: "group" }, el("h2", { ic: HEAD_IC.INSTRUMENT, text: "INSTRUMENT" }), el("p", { class: "dim", text: t("layout") }));
    const b = el("div", { class: "group" }, el("h2", { ic: HEAD_IC.EDIT, text: "EDIT" }));
    const c = el("div", { class: "group" }, el("h2", { ic: HEAD_IC.GLOBAL, text: "GLOBAL" }));
    for (let i = drum ? info.pe0 : 0; i < info.pcount; i++) { const r = paramRow(0, i); if (r) (i >= info.pe0 ? b : a).append(r); }
    for (let i = 0; i < info.gcount; i++) { const r = paramRow(1, i); if (r) c.append(r); }
    if (drum) groups.groups.push(b); else groups.groups.push(a, b);
    groups.setgroups.push(c);
  }
  for (const [id, divs] of Object.entries(groups)) $(id).replaceChildren(...divs);
}

function paramRow(s, id) {
  const d = s ? dev.gdesc[id] : dev.pdesc[id];
  if (!visible(d) || (s === 1 && G_SKIP.has(d.label))) return null;
  const k = key(s, id);
  let input;
  if (d.fmt === F.ENUM || d.fmt === F.NOTE || d.fmt === F.ONOFF) {
    const wave = RICH_SELECT && d.fmt === F.ENUM && /^WAVE2?$/.test(d.label);
    input = el("select", { class: wave ? "wave" : null });
    /* the closed select shows a copy of the chosen option (icon span included), not its bare text */
    if (wave) input.append(el("button", {}, el("selectedcontent")));
    for (let v = d.min; v <= d.max; v++) {
      const [txt] = fmtValue(d, v);
      const name = fm6VoiceText(s, id, v) ?? (d.fmt === F.ENUM && d.names[v - d.min] == null ? String(v) : txt);
      input.append(el("option", { value: v, ic: wave && WAVE_IC[name] }, name));
    }
    input.addEventListener("change", () => userSet(s, id, +input.value, true));
  } else {
    input = el("input", { type: "range", min: d.min, max: d.max, step: 1 });
    input.addEventListener("pointerdown", () => { dragging = k; });
    input.addEventListener("input", () => userSet(s, id, +input.value, false));
    input.addEventListener("change", () => userSet(s, id, +input.value, true));
    input.addEventListener("dblclick", () => { input.value = d.def; userSet(s, id, d.def, true); });
    /* fine adjust: wheel over the focused slider, Shift+arrows in steps of 10 (plain arrows are native) */
    const nudge = (dv) => {
      const nv = Math.max(d.min, Math.min(d.max, +input.value + dv));
      if (nv !== +input.value) { input.value = String(nv); userSet(s, id, nv, true); }
    };
    let acc = 0;
    input.addEventListener("wheel", (e) => {
      if (document.activeElement !== input) return;
      e.preventDefault();
      acc += (e.deltaMode === 1 ? 33 : 1) * (Math.abs(e.deltaY) >= Math.abs(e.deltaX) ? -e.deltaY : e.deltaX);
      const n = Math.trunc(acc / 50);
      if (n) { acc -= n * 50; nudge(n * (e.shiftKey ? 10 : 1)); }
    }, { passive: false });
    input.addEventListener("keydown", (e) => {
      const dir = { ArrowUp: 1, ArrowRight: 1, ArrowDown: -1, ArrowLeft: -1 }[e.key];
      if (!dir || !e.shiftKey) return;
      e.preventDefault();
      nudge(dir * 10);
    });
  }
  input.title = d.label;
  const out = el("span", { class: "v" });
  const row = el("div", { class: "row" }, el("span", { text: d.label }), input, out);
  ctl.set(k, { input, out, desc: d, scope: s, id, row });
  showValue(k, s ? dev.dump.g[id] : dev.dump.p[id], true);
  return row;
}

function showValue(k, v, force) {
  const c = ctl.get(k);
  if (!c || v == null) return;
  const [txt, unit] = fmtValue(c.desc, v);
  c.out.textContent = fm6VoiceText(c.scope, c.id, v) ?? (unit ? `${txt} ${unit}` : txt);
  if (force || !touched(k)) c.input.value = String(v);
}
/* the user is working on this control: polling and pushes must not move it */
function touched(k) {
  const c = ctl.get(k), st = sets.get(k);
  if (dragging === k) return true;
  if (c && c.input.tagName === "SELECT" && document.activeElement === c.input) return true;
  if (st && performance.now() - st.last < 600) return true;
  return !!dev && (dev.link.hasQueued(k) || (!!dev.link.cur && dev.link.cur.key === k));
}

window.addEventListener("pointerup", () => { if (dragging) { const k = dragging; dragging = null; const c = ctl.get(k); if (c) userSet(c.scope, c.id, +c.input.value, true); } });
window.addEventListener("pointercancel", () => { dragging = null; });

/* SET as fast as the device answers: one SET per control in flight and at most one queued, which
   always carries the latest value (Link coalesces by key), so a drag never builds a backlog */
function userSet(s, id, v, final) {
  if (!dev) return;
  const k = key(s, id);
  (s ? dev.dump.g : dev.dump.p)[id] = v;
  showValue(k, v, false);
  mixFromDump();
  let st = sets.get(k);
  if (!st) sets.set(k, (st = { last: 0, sent: null }));
  st.last = performance.now();
  if (v === st.sent) return;                        /* the last request already carries it */
  sendSet(s, id, k);
}
async function sendSet(s, id, k) {
  if (!dev) return;
  const st = sets.get(k);
  const v = (s ? dev.dump.g : dev.dump.p)[id];
  st.sent = v;
  try {
    const r = parse[CMD.SET](await rq(req.set(s, id, v), { key: k }));
    if (dev && dragging !== k && st.sent === v && !dev.link.hasQueued(k)) {   /* the device's value after clamping */
      (s ? dev.dump.g : dev.dump.p)[id] = r.value;
      showValue(k, r.value, false);
      mixFromDump();
    }
  } catch (e) { if (e.message !== "closed") console.warn(e); }
}

/* engine / preset browser */
$("engine").addEventListener("change", () => choosePreset(+$("engine").value, 0));
$("preset").addEventListener("change", () => { if (dev) choosePreset(dev.dump.engine, +$("preset").value); });
async function choosePreset(e, p) {
  if (!dev) return;
  busy++;
  try {
    selfLoad();
    parse[CMD.PRESET](await rq(req.preset(e, p)));
    await afterSoundChange();
  } catch (err) { report(err); } finally { busy--; }
}
async function afterSoundChange(msg = "ready") {
  needReload = false;                               /* this re-reads everything a RELOAD asks for */
  dev.dump = await getDump();
  await rereadEngineDesc();
  updateBrowser();
  refreshAll();
  await loadSteps();                                /* a preset can bring a pattern */
  if (hasTracks()) await readMixer();               /* the sound names and the selected strip */
  sayK(msg);
}
$("init").addEventListener("click", async () => {
  if (!dev || !confirm(t("confirmInit"))) return;
  busy++;
  try { selfLoad(); await rq(req.set(1, gEng(), dev.dump.engine)); await afterSoundChange(); }
  catch (err) { report(err); } finally { busy--; }
});

function refreshAll() {
  for (const [k, c] of ctl) showValue(k, c.scope ? dev.dump.g[c.id] : dev.dump.p[c.id], false);
  renderSteps();
}
function report(err) { if (err && err.message !== "closed") { console.warn(err); sayK("error", err.message); } }

/* projects: the protocol cannot ask whether a slot is used without loading or saving it */
function renderSlots() {
  const box = $("slots");
  box.replaceChildren();
  for (let i = 0; i < 4; i++) {
    const u = dev.slotUsed[i];
    box.append(el("span", { text: String(i + 1) }),
      el("span", { class: "dim", text: u == null ? t("unknown") : t(u ? "used" : "empty") }),
      el("button", { ic: "symbol_folder_open", onclick: () => project(0, i) }, t("load")),
      el("button", { ic: "port_disk", onclick: () => project(1, i) }, t("save")));
  }
}
async function project(op, slot) {
  if (!dev) return;
  if (!confirm(t(op ? "confirmSave" : "confirmLoad").replace("{n}", slot + 1))) return;
  busy++;
  try {
    /* save writes flash: a long timeout and no retry */
    if (!op) selfLoad();
    const r = parse[CMD.PROJECT](await rq(req.project(op, slot), { timeout: 4000, retries: 0 }));
    dev.slotUsed[slot] = r.used;
    renderSlots();
    if (!op && r.used) await afterSoundChange();
    sayK(op ? "savedSlot" : r.used ? "loadedSlot" : "emptySlot", String(slot + 1));
  } catch (err) { report(err); } finally { busy--; }
}

/* ---------------------------------------------------------- steps --- */
const TIMES = ["NOTE", "TIE", "REST"];
function renderStepHead() { if (dev && dev.steps.length) renderSteps(); }
const stepLen = () => Math.max(1, Math.min(dev.info.nstep, dev.dump.p[pSlen()] || 16));
/* a step's notes as text: GM drum names on the drum track */
const stepNotes = (s) => s.notes.slice(0, s.n).map(isDrum() ? drumName : noteName).join(" ");
function renderSteps() {
  if (!dev || !dev.steps.length) return;
  const len = stepLen();
  const box = $("steptables");
  const shape = len + (isDrum() ? "d" : "");
  $("noteshelp").textContent = t(isDrum() ? "drumHelp" : "notesHelp");
  renderGrid();
  /* keep the rows the user is typing in */
  if (box.contains(document.activeElement) && box.dataset.len === shape) { updateStepRows(); return; }
  box.dataset.len = shape;
  const tables = [];
  for (let b = 0; b < len; b += 16) {
    const tb = el("table", {}, el("tr", {}, el("th"), el("th", { text: t("notes") }), el("th", { text: t("time") }),
      el("th", { text: t("acc") }), el("th", { text: t("slide") }), el("th", { text: t("vel") })));
    for (let i = b; i < Math.min(len, b + 16); i++) tb.append(stepRow(i));
    tables.push(tb);
  }
  box.replaceChildren(...tables);
}
function stepRow(i) {
  const notes = el("input", { type: "text", placeholder: "—", spellcheck: "false" });
  const time = el("select", {}, ...TIMES.map((n, k) => el("option", { value: k, text: n })));
  const acc = el("input", { type: "checkbox" });
  const sl = el("input", { type: "checkbox" });
  const vel = el("input", { type: "number", min: 0, max: 127 });
  const tr = el("tr", { "data-i": i }, el("td", { class: "i", text: String(i + 1) }),
    el("td", {}, notes), el("td", {}, time), el("td", {}, acc), el("td", {}, sl), el("td", {}, vel));
  tr._c = { notes, time, acc, sl, vel };
  fillStep(tr, dev.steps[i]);
  const send = () => writeStep(i, tr);
  notes.addEventListener("change", send);
  time.addEventListener("change", send);
  acc.addEventListener("change", send);
  sl.addEventListener("change", send);
  vel.addEventListener("change", send);
  return tr;
}
function fillStep(tr, s) {
  const c = tr._c;
  if (!s) return;
  c.notes.value = stepNotes(s);
  c.notes.classList.remove("bad");
  c.time.value = String(s.time);
  c.acc.checked = !!(s.flags & 1);
  c.sl.checked = !!(s.flags & 2);
  c.vel.value = String(s.vel);
  tr.classList.toggle("off", !s.n || s.time === 2);
}
function updateStepRows() {
  for (const tr of $("steptables").querySelectorAll("tr[data-i]")) {
    if (tr.contains(document.activeElement)) continue;
    fillStep(tr, dev.steps[+tr.dataset.i]);
  }
  renderGrid();
}
/* the step grid: one cell per step up to LEN; a cell jumps to its row in the table */
function renderGrid() {
  const box = $("stepgrid");
  if (!dev || !dev.steps.length) { box.replaceChildren(); return; }
  const len = stepLen();
  if (box.children.length !== len) {
    box.replaceChildren(...Array.from({ length: len }, (_, i) => el("button", { type: "button", "data-i": i, onclick: () => focusStep(i) })));
  }
  for (const b of box.children) {
    const i = +b.dataset.i, s = dev.steps[i];
    const on = !!s && s.n > 0 && s.time === 0, tie = !!s && s.time === 1;
    const txt = on ? stepNotes(s) : tie ? "—" : "";
    const marks = s && on ? (s.flags & 1 ? " >" : "") + (s.flags & 2 ? " ~" : "") : "";
    b.className = [on && "on", tie && "tie", on && s.flags & 1 && "acc", i % 4 === 0 && "beat"].filter(Boolean).join(" ");
    b.title = `${i + 1}: ${on ? txt : tie ? "TIE" : "REST"}${marks}`;
    b.replaceChildren(el("span", { class: "n", text: String(i + 1) + marks }), el("span", { class: "x", text: txt }));
  }
}
function focusStep(i) {
  const tr = $("steptables").querySelector(`tr[data-i="${i}"]`);
  if (!tr) return;
  tr.scrollIntoView({ block: "center", behavior: "smooth" });
  tr._c.notes.focus({ preventScroll: true });
  tr.classList.add("hl");
  setTimeout(() => tr.classList.remove("hl"), 1200);
}
async function writeStep(i, tr) {
  const c = tr._c;
  const notes = parseNotes(c.notes.value);
  if (!notes) { c.notes.classList.add("bad"); return; }
  c.notes.classList.remove("bad");
  const old = dev.steps[i];
  const all = notes.concat(old.notes.slice(notes.length)).slice(0, 4);
  let time = +c.time.value;
  if (notes.length && !old.n && time === 2) time = 0;   /* typing notes into an empty step makes it play */
  const s = { n: notes.length, notes: all, time, flags: (c.acc.checked ? 1 : 0) | (c.sl.checked ? 2 : 0),
    vel: Math.max(0, Math.min(127, +c.vel.value || 0)) };
  if (s.n && !s.vel) s.vel = 96;
  stepEdit.set(i, performance.now());
  try {
    dev.steps[i] = parse[CMD.STEP_SET](await rq(req.stepSet(i, s)));
    if (!tr.contains(document.activeElement) || document.activeElement === c.notes) fillStep(tr, dev.steps[i]);
  } catch (err) { report(err); }
}
$("reloadsteps").addEventListener("click", async () => {
  if (!dev) return;
  busy++;
  try { await loadSteps(); sayK("ready"); } catch (err) { report(err); } finally { busy--; }
});
$("clearseq").addEventListener("click", async () => {
  if (!dev || !confirm(t("confirmClear"))) return;
  busy++;
  try {
    for (let i = 0; i < dev.info.nstep; i++) {
      if (i % 8 === 0) sayK("applying", `${i}/${dev.info.nstep}`);
      dev.steps[i] = parse[CMD.STEP_SET](await rq(req.stepSet(i, { n: 0, notes: [0, 0, 0, 0], time: 2, flags: 0, vel: 0 })));
    }
